<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange background -->
  <rect width="256" height="256" fill="#FF6B35"/>
  
  <!-- Atlas figure in teal -->
  <g fill="#008B8B" stroke="#000000" stroke-width="2">
    <!-- Head -->
    <ellipse cx="128" cy="80" rx="18" ry="20"/>
    
    <!-- Beard -->
    <path d="M 115 85 Q 128 95 141 85" fill="#008B8B"/>
    
    <!-- Torso -->
    <rect x="110" y="100" width="36" height="60" rx="8"/>
    
    <!-- Arms raised -->
    <ellipse cx="95" cy="120" rx="12" ry="25" transform="rotate(-45 95 120)"/>
    <ellipse cx="161" cy="120" rx="12" ry="25" transform="rotate(45 161 120)"/>
    
    <!-- Legs -->
    <ellipse cx="118" cy="180" rx="8" ry="25"/>
    <ellipse cx="138" cy="180" rx="8" ry="25"/>
    
    <!-- Loincloth -->
    <path d="M 110 160 Q 128 170 146 160 L 140 180 L 116 180 Z" fill="#008B8B"/>
  </g>
  
  <!-- Earth globe -->
  <g fill="#008B8B" stroke="#000000" stroke-width="2">
    <circle cx="128" cy="50" r="25"/>
    <!-- Continent outlines -->
    <path d="M 115 45 Q 125 40 135 45 Q 140 50 135 55 Q 125 60 115 55 Z" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 105 50 Q 115 45 125 50 Q 130 55 125 60 Q 115 65 105 60 Z" fill="none" stroke="#000000" stroke-width="1"/>
    <path d="M 135 50 Q 145 45 155 50 Q 160 55 155 60 Q 145 65 135 60 Z" fill="none" stroke="#000000" stroke-width="1"/>
  </g>
</svg>
