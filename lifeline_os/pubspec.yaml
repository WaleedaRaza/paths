name: lifeline_os
description: Personal AI productivity system (MGTST Framework)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Database (SQLite + SQLCipher)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.8.3

  # HTTP Client (Ollama)
  dio: ^5.4.0
  http: ^1.1.2
  url_launcher: ^6.2.2

  # LangChain AI Integration
  langchain: ^0.7.0
  langchain_ollama: ^0.3.0
  langchain_openai: ^0.7.6
  # flutter_secure_storage: ^9.0.0  # Requires ATL - use shared_preferences for now
  shared_preferences: ^2.2.2

  # UI/UX
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^1.0.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_markdown: ^0.6.18
  intl: ^0.18.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Window Management (Desktop)
  window_manager: ^0.3.7

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  collection: ^1.18.0
  file_picker: ^6.1.1
  timeago: ^3.6.1

  # Animations & Effects
  lottie: ^3.0.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  
  # Custom lints (optional but recommended)
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/

